<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Phiếu đăng ký tham gia chương trinh khuyến mãi </h1>
    <form action="">
        <table border="1" width="700px">
            <tr>
                <td>Họ và tên</td>
                <td><input type="text" name="" id=""></td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" name="" id=""></td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td><input type="number" name="" id=""></td>
            </tr>
            <tr>
                <td>Phái</td>
                <td>
                    <input type="radio" name="gioitinh" id="">Nam
                    <input type="radio" name="gioitinh" id="">Nữ
                </td>
            </tr>
            <tr>
                <td>Nghề nghiệp</td>
                <td><select name="" id="">
                    <option value="1">Giáo viên</option>
                    <option value="2">...</option>
                </select></td>
            </tr>
            <tr>
                <td>Chọn sản phẩm tham gia</td>
                <td><select id="products" name="products" multiple>
                    <option value="kem_danh_rang">Kem đánh răng</option>
                    <option value="bot_giat">Bột giặt</option>
                    <option value="dau_goi_dau">Dầu gội đầu</option>
                    <option value="sua_tam">Sữa tắm</option>
                  </select></td>
            </tr>
            <tr>
                <td>Số người dự đoán tham gia </td>
                <td><input type="number" name="" id="">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center"><button >Đồng ý</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
