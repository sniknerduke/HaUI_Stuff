    <h1>TUỔI THƠ</h1>
    <em><p> <mark>Tuổi thơ</mark> bắt <strong>dế</strong> đi cày <br>
        Nhà nghèo <strong>dế</strong> cững có một bầy như <strong>trâu</strong> <br>
        Sân nhà chẳng dám cày sâu <br>
        Lối ngang lối dọc trước sau đì về <br>
        Bây giờ ngồi nghĩ ngành nghề <br>
        Nhớ sao tiếng <strong>dế</strong> đêm hè kêu vang
      </p>
